[project]
name = "docuchat"
version = "0.1.0"
description = "Ask questions about a PDF and get answers with highlighted sources"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.3",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1",
    "langchain-text-splitters>=0.3",
    "fastembed>=0.4",
    "pgvector>=0.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# PyMuPDF's SWIG bindings, not ours
filterwarnings = ["ignore:builtin type .* has no __module__:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to sit in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
